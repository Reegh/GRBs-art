# config.yaml
data_paths:
  tte_nai1: "data/glg_tte_n1_bn251118855_v00.fit"
  cspec_nai1: "data/glg_cspec_n1_bn251118855_v00.pha"
  cspec_nai2: "data/glg_cspec_n2_bn251118855_v00.pha"
  cspec_bgo1: "data/glg_cspec_b0_bn251118855_v00.pha"
  rsp_nai1: "data/glg_cspec_n1_bn251118855_v02.rsp2"
  rsp_nai2: "data/glg_cspec_n2_bn251118855_v02.rsp2"
  rsp_bgo1: "data/glg_cspec_b0_bn251118855_v02.rsp2"

energy_ranges:
  nai: [8.0, 900.0]
  bgo: [325.0, 25000.0]

t90:
  t0: 0.0
  T90: 46.593

background:
  pre_bkg_range: [50, 10]
  post_bkg_range: [50, 100]
  polynomial_order: 1

burst_detection:
  percentile_for_bkg: 10
  sigma_threshold: 3

spectral_fitting:
  #model_expression: "Band()"
  #min_values: [1e-10, 0.01, -1.9, -10.0, 0.01]
  #max_values: ["inf", 5e4, 1.5, -2.05, "inf"]
  #default_values: [0.01, 500.0, -0.5, -2.3, 100.0]
  #fixed: [false, false, false, true, false]
  #eval_indices: [3]

  model_expression: "BlackBody()"
  eval_indices: [1]

  save_plots: true
  plots_output_dir: "results/espectros"

  fit_options:
    method: "TNC"
    maxiter: 500
  time_interval: 15.0
  analysis_start: 50.0
  analysis_stop: 65.0
  max_fit_time: 10
  relative_error_threshold: 20.0

plotting:
  parameters: ["Epeak", "alpha", "beta", "A"]  # Parámetros a graficar
  save_plots: false
  plots_dir: "results/plots"

output:
  file_name: "results/bb2_fit.csv"